services:
  # ─── Banco de dados PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: clinica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: teste4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teste4"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build:
      # O docker-compose.yml está na raiz do repositório do backend,
      # então "." aponta para o próprio repo do back.
      context: .
      dockerfile: Dockerfile.backend
    container_name: clinica_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexão JDBC apontando para o serviço "db" dentro da rede Docker
      # (host "db", e não "localhost", pois é dentro da rede do Compose)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/teste4
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # O schema é gerenciado pelo Flyway (migrations), então NÃO definimos
      # ddl-auto=update aqui para evitar que o Hibernate altere o schema em
      # paralelo e cause drift. O Flyway roda as migrations no startup.
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    # Sem healthcheck: o projeto não inclui o spring-boot-starter-actuator,
    # então não há um endpoint /health confiável. Caso queira um healthcheck,
    # basta adicionar o Actuator ao pom.xml e reativar o bloco abaixo:
    #   healthcheck:
    #     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/clinica-gastro/actuator/health || exit 1"]
    #     interval: 15s
    #     timeout: 5s
    #     retries: 10

  # ─── Frontend Next.js ───────────────────────────────────────────────────────--
  frontend:
    build:
      # Aponta para o repositório do frontend clonado ao lado deste (backend).
      # Estrutura esperada:
      #   pasta-pai/
      #     clinica-backend/   <- você está aqui (docker-compose.yml)
      #     clinica-frontend/  <- repo do front (ajuste o nome se necessário)
      #
      # Para sobrescrever o caminho, crie um arquivo .env na raiz do backend:
      #   FRONTEND_PATH=../nome-real-do-repo-front
      context: ${FRONTEND_PATH:-../clinica-frontend}
      dockerfile: Dockerfile
      args:
        # IMPORTANTE: o front chama a API pelo NAVEGADOR, então a URL precisa ser
        # acessível a partir da máquina do usuário (host), e NÃO o nome interno
        # "backend" da rede Docker. Por isso usamos localhost:8080.
        # O sufixo /clinica-gastro é o context-path definido no backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/clinica-gastro}
    container_name: clinica_frontend
    restart: unless-stopped
    # O front chama a API pelo navegador em runtime, então basta aguardar o
    # backend iniciar (service_started) — não precisa esperar ficar "healthy".
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/clinica-gastro}
    ports:
      - "3000:3000"

volumes:
  db_data:
