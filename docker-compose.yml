services:
  # ─── Banco de dados PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: clinica_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: teste4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teste4"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build:
      # Caminho do repositório do backend (clonado ao lado deste projeto).
      # Ajuste via variável BACKEND_PATH no arquivo .env, se necessário.
      context: ${BACKEND_PATH:-../clinica-backend}
      dockerfile: Dockerfile.backend
    container_name: clinica_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexão JDBC apontando para o serviço "db" dentro da rede Docker
      # (host "db", e não "localhost", pois é dentro da rede do Compose)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/teste4
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Dialeto/driver do PostgreSQL
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      # Atenção ao context-path /clinica-gastro definido no application.properties.
      # Se o Actuator não estiver no projeto, troque por:
      #   wget -qO- http://localhost:8080/clinica-gastro/login || exit 0
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/clinica-gastro/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Frontend Next.js ───────────────────────────────────────────────────────--
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # IMPORTANTE: o front chama a API pelo NAVEGADOR, então a URL precisa ser
        # acessível a partir da máquina do usuário (host), e NÃO o nome interno
        # "backend" da rede Docker. Por isso usamos localhost:8080.
        # O sufixo /clinica-gastro é o context-path definido no backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/clinica-gastro}
    container_name: clinica_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/clinica-gastro}
    ports:
      - "3000:3000"

volumes:
  db_data:
